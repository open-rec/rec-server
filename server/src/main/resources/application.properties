spring.profiles.active=standalone
spring.jackson.use-jackson2-defaults=true
serving.graph.item-file=${ITEM_GRAPH_FILE:item_graph.json}
serving.graph.user-file=${USER_GRAPH_FILE:user_graph.json}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=rec-server
server.blocking.threads=${SERVER_BLOCKING_THREADS:32}
server.blocking.queue-capacity=${SERVER_BLOCKING_QUEUE_CAPACITY:256}
recommend.deadline-ms=${RECOMMEND_DEADLINE_MS:1000}
server.error.include-message=always
recommend.warmup.user-id=${RECOMMEND_WARMUP_USER_ID:}
recommend.warmup.scene=${RECOMMEND_WARMUP_SCENE:scene_0}

# Optional online query embedding. No request is made when disabled.
embedding.enabled=${EMBEDDING_ENABLED:false}
embedding.endpoint=${EMBEDDING_ENDPOINT:http://vllm:8000/v1/embeddings}
embedding.model=${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
embedding.api-key=${EMBEDDING_API_KEY:}
embedding.instruction=${OPENREC_TEXT_EMBEDDING_INSTRUCTION:Given a search query, retrieve relevant items that match the query}
embedding.dimensions=${EMBEDDING_DIMENSIONS:1024}
embedding.timeout-ms=${EMBEDDING_TIMEOUT_MS:500}
embedding.max-concurrent=${EMBEDDING_MAX_CONCURRENT:8}
embedding.max-chars=${EMBEDDING_MAX_CHARS:4096}
