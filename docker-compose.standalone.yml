services:
  rec-server:
    build:
      context: .
    image: openrec/rec-server:latest
    container_name: rec-server
    hostname: rec-server
    restart: unless-stopped
    environment:
      OPENREC_GRAPH_EXECUTOR: ${OPENREC_GRAPH_EXECUTOR:-virtual}
      OPENREC_GRAPH_WORKER_THREADS: ${OPENREC_GRAPH_WORKER_THREADS:-}
      OPENREC_GRAPH_WORKER_QUEUE_CAPACITY: ${OPENREC_GRAPH_WORKER_QUEUE_CAPACITY:-1024}
      RECOMMEND_WARMUP_USER_ID: ${RECOMMEND_WARMUP_USER_ID:-}
      RECOMMEND_WARMUP_SCENE: ${RECOMMEND_WARMUP_SCENE:-scene_0}
      SPRING_PROFILES_ACTIVE: standalone
      RECOMMEND_DEADLINE_MS: ${RECOMMEND_DEADLINE_MS:-1000}
      REDIS_HOSTNAME: redis
      REDIS_PORT: 6379
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_USER: elastic
      ES_PASSWORD: ${ELASTIC_PASSWORD:-openrec-es-password}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-http://vllm:8000/v1/embeddings}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-500}
      EMBEDDING_MAX_CONCURRENT: ${EMBEDDING_MAX_CONCURRENT:-8}
      EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-4096}
      OPENREC_TEXT_EMBEDDING_INSTRUCTION: ${OPENREC_TEXT_EMBEDDING_INSTRUCTION:-Given a search query, retrieve relevant items that match the query}
      SERVING_GRAPH_TOKEN: ${SERVING_GRAPH_TOKEN:-openrec-serving-graph-token-change-me}
    ports:
      - "13579:13579"
    networks:
      - openrec-bigdata

networks:
  openrec-bigdata:
    external: true
    name: openrec-bigdata
