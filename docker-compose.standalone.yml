services:
  rec-server:
    build:
      context: .
    image: openrec/rec-server:latest
    container_name: rec-server
    hostname: rec-server
    restart: unless-stopped
    environment:
      RECOMMEND_WARMUP_USER_ID: ${RECOMMEND_WARMUP_USER_ID:-}
      RECOMMEND_WARMUP_SCENE: ${RECOMMEND_WARMUP_SCENE:-scene_0}
      SPRING_PROFILES_ACTIVE: standalone
      RECOMMEND_DEADLINE_MS: ${RECOMMEND_DEADLINE_MS:-1000}
      REDIS_HOSTNAME: redis
      REDIS_PORT: 6379
      ES_HOST: elasticsearch
      ES_PORT: 9200
      ES_USER: elastic
      ES_PASSWORD: ${ELASTIC_PASSWORD:-openrec-es-password}
      RECALL_STORE: ${RECALL_STORE:-elasticsearch}
      SERVING_GRAPH_TOKEN: ${SERVING_GRAPH_TOKEN:-openrec-serving-graph-token-change-me}
    ports:
      - "13579:13579"
    networks:
      - openrec-bigdata

networks:
  openrec-bigdata:
    external: true
    name: openrec-bigdata
